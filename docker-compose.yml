name: xui-billing

x-app: &app
  build:
    context: .
    args:
      APP_URL: ${APP_URL}
      PLATFORM_NAME: ${PLATFORM_NAME:-OrbitModul}
      PLATFORM_TAGLINE: ${PLATFORM_TAGLINE:-}
  image: xui-billing:latest
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [internal]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  app:
    <<: *app
    command: ["web"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      app:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # HTTPS (443) is served by Caddy on the host with the Cloudflare Origin certificate
      # (https-cloudflare.sh) and forwarded here to port 80.
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      # NGINX_MODE=http (IP, no certificate) or https (domain + nginx/certs/*.pem)
      - ./nginx/${NGINX_MODE:-http}:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot
    depends_on:
      - app
    networks: [internal]

  # Daily PostgreSQL backups (kept 14 days) into ./backups
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  certbot-www:

networks:
  internal:
